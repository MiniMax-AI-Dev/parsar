<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#202020" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- No webfonts: the UI uses the system stack (SF Pro / PingFang on
         macOS, Segoe UI / YaHei on Windows). See DESIGN.md. -->
    <title>Parsar</title>
    <script>
      ;(() => {
        const stored = localStorage.getItem("parsar.theme")
        const preference =
          stored === "light" || stored === "dark" || stored === "system" ? stored : "system"
        const resolved =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference
        document.documentElement.dataset.theme = resolved
        document.documentElement.style.colorScheme = resolved
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
