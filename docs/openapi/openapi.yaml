      responses:
        "200":
          description: Updated settings
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid body or UUID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Caller is not workspace owner/admin
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update workspace settings
      tags:
      - workspaces
  /api/v1/workspaces/{workspaceID}/skills/install:
    post:
      consumes:
      - application/json
      description: Downloads a Skills.sh Skill with npx skills add, stores the Skill
        folder as a zip, and reuses the existing Skill zip import flow. Owner/admin
        only.
      operationId: installSkillsShSkill
      parameters:
      - description: Workspace UUID
        in: path
        name: workspaceID
        required: true
        type: string
      - description: Skills.sh install payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dev.installSkillRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created capability, version, and secret ids
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Install a Skills.sh Skill as a capability
      tags:
      - capabilities
  /api/v1/workspaces/{workspaceID}/skills/installed:
    get:
      operationId: listSkillsDirectoryInstalls
      parameters:
      - description: Workspace UUID
        in: path
        name: workspaceID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Registry ID to workspace capability ID
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List installed Skills.sh skills
      tags:
      - capabilities
  /api/v1/workspaces/{workspaceID}/skills/preview:
    post:
      consumes:
      - application/json
      description: Downloads and parses the current repository content with the existing
        Skills installer and ZIP parser. Owner/admin only. Does not install a capability.
      operationId: previewSkillsShSkill
      parameters:
      - description: Workspace UUID
        in: path
        name: workspaceID
        required: true
        type: string
      - description: Skills.sh source
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dev.installSkillRequest'
      produces:
      - application/json
      responses:
        "200":
          description: canonical_spec, warnings, suggested_name, entry_markdown
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Preview a Skills.sh Skill before installation
      tags:
      - capabilities
  /api/v1/workspaces/{workspaceID}/spec/fragments:
    get:
      description: Returns spec fragments visible to the workspace. Optional source/tag
        filters narrow the list.
      operationId: listWorkspaceSpecFragments
      parameters:
      - description: workspace id
        in: path
        name: workspaceID
        required: true
        type: string
      - description: filter by source
        enum:
        - manual
        - agent
        - import
        - user
        - auto-review
        in: query
        name: source
        type: string
      - description: comma-separated tags
        in: query
        name: tag
        type: string
      - description: page size (1-500, default 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List workspace spec fragments
      tags:
      - memories
    post:
      consumes:
      - application/json
      description: Persists a manual (UI-authored) spec fragment for the workspace.
        Caller must be a workspace member.
      operationId: createWorkspaceSpecFragment
      parameters:
      - description: workspace id
        in: path
        name: workspaceID
        required: true
        type: string
      - description: fragment content
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/specmem.createFragmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/specmem.fragmentDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a workspace spec fragment
      tags:
      - memories
  /api/v1/workspaces/{workspaceID}/spec/fragments/{fragmentID}:
    delete:
      description: Deletes a spec fragment. Cross-workspace deletes are masked as
        404.
      operationId: deleteWorkspaceSpecFragment
      parameters:
      - description: workspace id
        in: path
        name: workspaceID
        required: true
        type: string
      - description: fragment id
        in: path
        name: fragmentID
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a workspace spec fragment
      tags:
      - memories
    patch:
      consumes:
      - application/json
      description: Mutates a fragment's content. Cross-workspace access is masked
        as 404 so ids aren't enumerable.
      operationId: updateWorkspaceSpecFragment
      parameters:
      - description: workspace id
        in: path
        name: workspaceID
        required: true
        type: string
      - description: fragment id
        in: path
        name: fragmentID
        required: true
        type: string
      - description: new content
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/specmem.updateFragmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/specmem.fragmentDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a workspace spec fragment
      tags:
      - memories
  /api/v1/workspaces/{workspaceID}/spec/import:
    post:
      consumes:
      - application/json
      description: Slices a spec document into fragments. confirm=false previews;
        confirm=true persists every piece with SourceImport.
      operationId: importWorkspaceSpec
      parameters:
      - description: workspace id
        in: path
        name: workspaceID
        required: true
        type: string
      - description: spec text and confirm flag
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/specmem.importSpecRequest'
      produces:
      - application/json
      responses:
        "200":
          description: preview (confirm=false)
          schema:
            $ref: '#/definitions/specmem.importSpecResponse'
        "201":
          description: persisted (confirm=true)
          schema:
            $ref: '#/definitions/specmem.importSpecResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: partial import (rows persisted before failure)
          schema:
            additionalProperties: true
            type: object
      summary: Import a spec document
      tags:
      - memories
  /api/v1/workspaces/{workspaceID}/uploads/presign-download:
    post:
      consumes:
      - application/json
      description: Returns a presigned URL for downloading a previously-uploaded plugin/skill
        zip. Validates the ref belongs to the calling workspace (403 on mismatch)
        to close the cross-tenant read hole. Caller must be workspace capability admin.
      operationId: createDevWorkspaceDownloadPresign
      parameters:
      - description: Workspace UUID
        in: path
        name: workspaceID
        required: true
        type: string
      - description: Presign download payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dev.presignDownloadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Presigned download spec
          schema:
            $ref: '#/definitions/dev.presignDownloadResponse'
        "400":
          description: Body invalid or ossKey empty
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Ref does not belong to this workspace
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Blob backend error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Object storage not configured
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Presign a plugin/skill download
      tags:
      - uploads
  /api/v1/workspaces/{workspaceID}/uploads/presign-upload:
    post:
      consumes:
      - application/json
      description: Returns a presigned URL the browser PUTs the plugin/skill zip to.
        The blob backend (OSS or PG) mints a workspace-scoped ref that later downloads
        verify against. Caller must be workspace capability admin.
      operationId: createDevWorkspaceUploadPresign
      parameters:
      - description: Workspace UUID
        in: path
        name: workspaceID
        required: true
        type: string
      - description: Presign upload payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dev.presignUploadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Presigned upload spec
          schema:
            $ref: '#/definitions/dev.presignUploadResponse'
        "400":
          description: Body invalid, filename empty, or prefix not in {plugin,skill}
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Caller lacks capability admin permission
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Blob backend error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Object storage not configured
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Presign a plugin/skill upload
      tags:
      - uploads
  /dev/auth/verify:
    post:
      consumes:
      - application/json
      description: Development-only login. Verifies the fixed dev code and returns
        a bearer token plus the default seed workspace + user. Never enable in production.
      operationId: verifyDevAuth
      parameters:
      - description: '{email, code}'
        in: body
        name: body
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Bearer token + user + workspace
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid json
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid dev credentials
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Dev-only email + code login
      tags:
      - dev
  /dev/gateway/inbound:
    post:
      consumes:
      - application/json
      description: Writes an inbound gateway envelope from the connector daemon into
        storage for dispatch. Development helper.
      operationId: createDevGatewayInbound
      parameters:
      - description: Gateway inbound payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dev.gatewayInboundRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created row
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid body
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create an inbound gateway envelope
      tags:
      - gateway
  /dev/gateway/outbound:
    get:
      description: Returns outbound gateway messages, optionally filtered by connector
        or delivery status.
      operationId: listDevGatewayOutbound
      produces:
      - application/json
      responses:
        "200":
          description: Outbound message rows
          schema:
            additionalProperties: true
            type: object
      summary: List outbound gateway messages
      tags:
      - gateway
  /dev/gateway/outbound/{messageID}/delivered:
    post:
      consumes:
      - application/json
      description: Marks a gateway outbound message row as delivered. Used by the
        connector daemon to close the loop.
      operationId: markDevGatewayOutboundDelivered
      parameters:
      - description: Message ID
        in: path
        name: messageID
        required: true
        type: string
      - description: Delivery payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dev.markGatewayOutboundDeliveredBody'
      produces:
      - application/json
      responses:
        "200":
          description: Updated row
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid body or ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Message not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Mark an outbound gateway message delivered
      tags:
      - gateway
  /internal/im/history:
    get:
      description: Returns a bounded, live page of IM messages for the given conversation.
        Authenticated by the per-conversation bearer token issued to the sandbox subprocess;
        unsupported platforms yield an empty 200 page.
      operationId: getInternalIMHistory
      parameters:
      - description: conversation id
        in: query
        name: conversation_id
        required: true
        type: string
      - description: optional platform-native thread scope
        in: query
        name: thread_id
        type: string
      - description: max messages (adapter default when 0)
        in: query
        name: limit
        type: integer
      - description: opaque page cursor from a prior response
        in: query
        name: cursor
        type: string
      - description: bearer token override (falls back to Authorization header)
        in: query
        name: token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: message page
          schema:
            additionalProperties: true
            type: object
        "400":
          description: missing conversation_id
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: unknown conversation
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: fetch history failed
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fetch internal IM history
      tags:
      - internal
  /readyz:
    get:
      description: Readiness probe. Pings each wired dependency (currently the database).
        Returns 200 with status "ok" iff every check reports ok; otherwise 503 with
        status "degraded".
      operationId: getReadyz
      produces:
      - application/json
      responses:
        "200":
          description: All dependencies healthy
          schema:
            $ref: '#/definitions/api.ReadyResponse'
        "503":
          description: One or more dependencies unhealthy or not configured
          schema:
            $ref: '#/definitions/api.ReadyResponse'
      summary: Readiness probe
      tags:
      - health
schemes:
- http
- https
securityDefinitions:
  CookieAuth:
    in: cookie
    name: parsar_session
    type: apiKey
swagger: "2.0"
