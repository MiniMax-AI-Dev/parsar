      parameters:
      - description: Workspace UUID
        in: path
        name: workspaceID
        required: true
        type: string
      - description: Agent UUID
        in: path
        name: agentID
        required: true
        type: string
      - description: Capability version UUID
        in: path
        name: capabilityVersionID
        required: true
        type: string
