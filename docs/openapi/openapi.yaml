      responses:
        "204":
          description: Session cleared
        "503":
          description: Session store not wired
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log out the current session
      tags:
      - auth
  /api/v1/auth/providers:
    get:
      description: Returns the login providers the public login page may render. Sensitive
        diagnostics are omitted.
      operationId: listAuthProviders
      produces:
      - application/json
      responses:
        "200":
          description: Auth providers
          schema:
            $ref: '#/definitions/dev.authProvidersResponse'
      summary: List auth providers
      tags:
      - auth
  /api/v1/bootstrap:
    post:
      consumes:
      - application/json
      description: Creates the first user, their workspace, and (if password provided)
        an email/password identity. Auto-issues a session cookie on success.
      operationId: provisionBootstrap
      parameters:
      - description: owner email, password, workspace name
        in: body
