      operationId: searchDevUsers
      parameters:
      - description: Search keyword
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User list
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Caller is not authenticated
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Search users
      tags:
      - me
  /api/v1/workspaces:
    post:
      consumes:
      - application/json
      description: Creates a new workspace and adds the caller as the initial owner.
      operationId: createDevWorkspace
      parameters:
      - description: Workspace payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dev.createWorkspaceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created workspace
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid body
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Caller is not authenticated
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a workspace
      tags:
      - workspaces
  /api/v1/workspaces/{workspaceID}:
    patch:
      consumes:
      - application/json
      description: Partially updates a workspace's mutable fields. Owner/admin only.
      operationId: updateDevWorkspace
      parameters:
      - description: Workspace UUID
        in: path
        name: workspaceID
        required: true
        type: string
      - description: Workspace update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dev.updateWorkspaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated workspace
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid body or UUID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Caller is not workspace owner/admin
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a workspace
      tags:
      - workspaces
  /api/v1/workspaces/{workspaceID}/agent-runs:
    get:
      description: Returns agent-run rows, including retained history and agent_deleted
        state after Agent deletion. Caller must be a workspace member.
      operationId: listDevWorkspaceAgentRuns
      parameters:
      - description: Workspace UUID
        in: path
        name: workspaceID
        required: true
        type: string
      - description: Case-insensitive literal search over run ID, Agent name/slug,
          and conversation ID
        in: query
        name: q
        type: string
      - description: Comma-separated run statuses
        in: query
        name: status
        type: string
      - default: 100
        description: Page size
        in: query
        name: limit
        type: integer
      - default: 0
        description: Result offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Agent run rows
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid UUID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Caller is not a workspace member
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List workspace agent runs
      tags:
      - agent-runs
  /api/v1/workspaces/{workspaceID}/agent-runs/{runID}/events:
    get:
      description: Returns the persisted lifecycle events (message deltas, tool calls,
        permissions, run.* markers) for the run. Supports after_sequence for incremental
        polling.
      operationId: listDevAgentRunEvents
      parameters:
      - description: Workspace UUID
        in: path
        name: workspaceID
        required: true
        type: string
      - description: Agent run UUID
        in: path
        name: runID
        required: true
        type: string
      - description: Only return events with sequence > this value
        in: query
        name: after_sequence
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{events: [...] }'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: workspace_id or run_id is not a valid uuid, or after_sequence
            is negative
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Caller is not a workspace member
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Run not found or not part of workspace
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Database-backed read APIs are disabled
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List agent run lifecycle events
      tags:
      - agent-runs
  /api/v1/workspaces/{workspaceID}/agents:
    get:
      description: Returns agents the caller can address in the given workspace. By
        default only enabled/active agents; pass include_disabled=true for the admin
        view.
      operationId: listDevAgents
      parameters:
      - description: Workspace UUID
        in: path
        name: workspaceID
        required: true
        type: string
      - description: Include disabled/archived agents in the response
        in: query
        name: include_disabled
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Active workspace agents with profile basics
          schema:
            additionalProperties: true
            type: object
        "400":
          description: workspace_id must be a valid uuid
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Caller is not an active workspace member
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Database-backed read APIs are disabled
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List active agents in a workspace
      tags:
      - agents
    post:
      consumes:
      - application/json
      description: Creates an Agent with a workspace catalog model_id, explicit harness
        and environment. Parsar resolves the execution model; Core runs it. Owner/admin
        only.
      operationId: createDevAgent
      parameters:
      - description: Workspace UUID
        in: path
        name: workspaceID
        required: true
        type: string
      - description: Agent create payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dev.createAgentBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created agent
          schema:
            additionalProperties: true
            type: object
        "400":
          description: workspace_id must be a valid uuid, or body invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Caller is not workspace owner/admin
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Immutable field or unknown capability
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create an agent in a workspace
      tags:
      - agents
  /api/v1/workspaces/{workspaceID}/agents/{agentID}:
    get:
      description: Returns the complete agent summary and persisted config. The caller
        must be an active member of the workspace, and the agent must belong to that
        workspace.
