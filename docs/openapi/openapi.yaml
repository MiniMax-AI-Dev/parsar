  /api/v1/memories:
    get:
      description: Returns memories in the requested scope. scope=user returns the
        caller's private bucket; scope=workspace requires membership and a workspace_id
        query param.
      operationId: listMemories
      parameters:
      - description: memory scope
        enum:
        - user
        - workspace
        in: query
        name: scope
        required: true
        type: string
      - description: workspace id (required when scope=workspace)
        in: query
        name: workspace_id
        type: string
      - description: memory type filter
        enum:
        - user
        - feedback
        - workspace
        - reference
        in: query
        name: memory_type
        type: string
      - description: comma-separated tag filter
        in: query
        name: tag
        type: string
      - description: page size (1-500, default 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List memories
      tags:
      - memories
    post:
      consumes:
      - application/json
      description: Persists a user- or workspace-scope memory. scope=user requires
        only a session; scope=workspace requires non-viewer workspace membership.
      operationId: createMemory
      parameters:
      - description: memory payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/specmem.createMemoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/specmem.memoryDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a memory
      tags:
      - memories
  /api/v1/memories/{memoryID}:
    delete:
      description: Deletes a memory. Cross-owner or cross-workspace deletes are masked
        as 404.
      operationId: deleteMemory
      parameters:
      - description: memory id
        in: path
        name: memoryID
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a memory
      tags:
      - memories
    patch:
      consumes:
      - application/json
      description: Mutates a memory's content. Cross-owner or cross-workspace access
        is masked as 404.
      operationId: updateMemory
      parameters:
      - description: memory id
        in: path
        name: memoryID
        required: true
        type: string
      - description: new content
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/specmem.updateMemoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/specmem.memoryDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a memory
      tags:
      - memories
  /api/v1/parsar-daemon/download:
    get:
      description: Serves the daemon or companion CLI binary for the requested os/arch
        pair from the image's baked-in binary directory. Unauthenticated — the pairing
        token is what gates the actual connect.
      operationId: downloadParsarDaemon
      parameters:
      - description: target GOOS
        enum:
        - darwin
        - linux
        in: query
        name: os
        required: true
        type: string
      - description: target GOARCH
        enum:
        - amd64
        - arm64
        in: query
        name: arch
        required: true
        type: string
      - description: binary name (defaults to parsar-daemon)
        enum:
        - parsar-daemon
        - parsar
        in: query
        name: binary
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: device runtime binary stream
          schema:
            type: file
        "400":
          description: os/arch not in the accepted allowlist
          schema:
            type: string
        "404":
          description: no binary for that os/arch in this image
          schema:
            type: string
      summary: Download device runtime binary
      tags:
      - runtimes
  /api/v1/parsar-daemon/install.sh:
    get:
      description: Returns the shell script that fetches and installs the parsar-daemon
        binary. Unauthenticated — the script itself has no secrets.
      operationId: installParsarDaemonScript
      produces:
      - text/plain
      responses:
        "200":
          description: install script body
          schema:
            type: string
      summary: Serve parsar-daemon install script
      tags:
      - runtimes
  /api/v1/plugins/{pluginName}/client.js:
    get:
      description: Returns the built client.js for a plugin. Used by the web UI to
        load plugin UI components at runtime.
      operationId: servePluginClientBundle
      parameters:
      - description: Plugin directory name (scope-stripped, e.g. hotel-ops)
        in: path
        name: pluginName
        required: true
        type: string
      produces:
      - application/javascript
      responses:
        "200":
          description: JavaScript bundle
          schema:
            type: string
        "404":
          description: Plugin or client bundle not found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Plugin serving not configured
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Serve plugin client bundle
      tags:
      - plugins
  /api/v1/scheduled-tasks/{taskID}:
    delete:
      description: Soft-deletes the scheduled task. Idempotent; caller must be a workspace
        member with edit rights.
      operationId: deleteDevScheduledTask
      parameters:
      - description: Scheduled task UUID
        in: path
        name: taskID
        required: true
        type: string
      responses:
        "204":
          description: Scheduled task deleted
        "400":
          description: task_id must be a valid uuid
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Caller is a viewer or not a workspace member
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Scheduled task not found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Database-backed APIs are disabled
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a scheduled task
      tags:
      - scheduled-tasks
    get:
      description: Returns the scheduled task detail. Caller must be a member of the
        workspace owning the task.
      operationId: getDevScheduledTask
      parameters:
      - description: Scheduled task UUID
        in: path
        name: taskID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Scheduled task
          schema:
            additionalProperties: true
            type: object
        "400":
          description: task_id must be a valid uuid
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Caller is not a workspace member
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Scheduled task not found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Database-backed APIs are disabled
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a scheduled task
      tags:
      - scheduled-tasks
    patch:
      consumes:
      - application/json
      description: Overwrites the scheduled task's name/prompt/cron/timezone/enabled
        fields; next_run_at is recomputed from cron_expr + timezone. Caller must be
        a workspace member with edit rights.
      operationId: updateDevScheduledTask
      parameters:
      - description: Scheduled task UUID
        in: path
        name: taskID
        required: true
        type: string
      - description: Scheduled task update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dev.scheduledTaskUpdateBody'
      produces:
      - application/json
      responses:
        "200":
          description: Updated scheduled task
          schema:
            additionalProperties: true
            type: object
        "400":
          description: task_id invalid, body invalid, or cron_expr/timezone bad
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Caller is a viewer or not a workspace member
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Scheduled task not found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Database-backed APIs are disabled
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a scheduled task
      tags:
      - scheduled-tasks
  /api/v1/scheduled-tasks/{taskID}/run-now:
    post:
      description: Enqueues an out-of-band execution of the task, independent of cron
        cadence. 409 if another run is already active for the same task.
      operationId: runDevScheduledTaskNow
      parameters:
      - description: Scheduled task UUID
        in: path
        name: taskID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Run enqueued; response carries run_id
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: task_id must be a valid uuid
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Caller is a viewer or not a workspace member
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Scheduled task not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: A run is already active for this task
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Database-backed APIs are disabled
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger a scheduled task immediately
      tags:
      - scheduled-tasks
  /api/v1/scheduled-tasks/{taskID}/runs:
    get:
      description: Returns up to 50 most recent agent_run rows spawned by this scheduled
        task. Caller must be a workspace member.
      operationId: listDevScheduledTaskRuns
      parameters:
      - description: Scheduled task UUID
        in: path
        name: taskID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Recent runs for the scheduled task
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "400":
          description: task_id must be a valid uuid
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Caller is not a workspace member
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Scheduled task not found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Database-backed APIs are disabled
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List runs for a scheduled task
      tags:
      - scheduled-tasks
  /api/v1/users/search:
    get:
      description: Searches directory users by name, email, or handle. Used for member
