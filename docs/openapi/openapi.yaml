        stored ZIP. When version is omitted, the server advances the latest version
        automatically. Spec.kind must match capability.type. When oss_key is omitted
        for plugin or skill-zip kinds, the previous version's bytes are reused. Owner/admin
        only.
      operationId: commitDevCapabilityVersionImport
      parameters:
      - description: Workspace UUID
        in: path
        name: workspaceID
        required: true
        type: string
      - description: Capability UUID
        in: path
        name: capabilityID
        required: true
        type: string
      - description: Version import payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dev.commitCapabilityImportBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created capability version and secret ids
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid capability_id, missing kind, or spec rebuild failed
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Caller is not workspace owner/admin, or oss_key not owned by
            this workspace
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Capability not found in this workspace
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Invalid Skill content or capability kind mismatch
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Secrets service unavailable
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Failed to read or store Skill ZIP
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Object storage or database not configured
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Commit a new version of an existing capability
      tags:
      - capabilities
