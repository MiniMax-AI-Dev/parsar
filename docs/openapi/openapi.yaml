        name: workspaceID
        required: true
        type: string
      - description: Agent UUID
        in: path
        name: agentID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: workspace_id, agent_id, installed, available, marketplace_available
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid UUID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Caller is not an active workspace member
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Agent not found in this workspace
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Database-backed capability APIs are disabled
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List agent capabilities
      tags:
      - capabilities
  /api/v1/workspaces/{workspaceID}/agents/{agentID}/capabilities/{capabilityVersionID}:
    delete:
      description: Removes the given capability version from the agent. Workspace
        owner, admin, or member only. Successful requests appear in Agent audit.
