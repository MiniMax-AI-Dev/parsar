        required: true
        schema:
          $ref: '#/definitions/bootstrap.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/bootstrap.CreateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bootstrap.ErrorResponse'
        "409":
          description: bootstrap already closed
          schema:
            $ref: '#/definitions/bootstrap.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/bootstrap.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/bootstrap.ErrorResponse'
      summary: Provision first owner
      tags:
      - bootstrap
  /api/v1/bootstrap/status:
    get:
      description: Reports whether the bootstrap door is still open (no owner exists
