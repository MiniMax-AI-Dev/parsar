      parameters:
      - description: Workspace UUID
        in: path
        name: workspaceID
        required: true
        type: string
      - description: Agent UUID
        in: path
        name: agentID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Complete agent summary and config
          schema:
            $ref: '#/definitions/store.AgentSummary'
        "400":
          description: Invalid UUID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Caller is forbidden from accessing the workspace
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Workspace membership or agent not found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Database-backed read APIs are disabled
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get an agent in a workspace
      tags:
      - agents
  /api/v1/workspaces/{workspaceID}/agents/{agentID}/capabilities:
    get:
      description: Returns installed capabilities, their pinning_mode and bound/latest
        version metadata, plus available workspace and marketplace capabilities. Latest
