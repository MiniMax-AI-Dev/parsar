      operationId: getBootstrapStatus
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bootstrap.StatusResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/bootstrap.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/bootstrap.ErrorResponse'
      summary: Bootstrap status
      tags:
      - bootstrap
  /api/v1/capabilities/marketplace:
