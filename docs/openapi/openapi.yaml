          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Caller is not a workspace member or is viewer-only
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Conversation not found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Bulk cancel not supported by current store
          schema:
            additionalProperties:
              type: string
            type: object
