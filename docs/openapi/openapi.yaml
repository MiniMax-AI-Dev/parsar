            type: object
        "403":
          description: Caller lacks permission
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Conversation not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a conversation's timeline
      tags:
      - conversations
