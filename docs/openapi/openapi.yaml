        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to admin Connections view
        "400":
          description: Missing state/code or CSRF mismatch
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Not authenticated
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: GitHub OAuth exchange failed
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
