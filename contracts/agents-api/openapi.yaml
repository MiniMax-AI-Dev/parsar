      security:
      - BearerAuth: []
      summary: Create a Vault
      tags:
      - Vaults
  /vaults/{vault_id}:
    get:
      description: Reads a Vault owned by the authenticated project without resolving
        credentials, Sessions or execution devices. Missing and foreign IDs share
        the same not-found response; exact hosted error semantics remain unverified.
      parameters:
      - description: agents=v1
