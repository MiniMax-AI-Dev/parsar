  /vaults:
    post:
      consumes:
      - application/json
      description: Creates a project-owned Vault independently of execution. Omitted
        name stays null; a supplied string is trimmed and must contain 1–256 UTF-8
        bytes. Explicit null name is invalid. Omitted/null metadata becomes an empty
        object; values must be strings. Metadata has a local 64 KiB encoded storage
        bound. Credentials, Session binding and hosted error/retry parity remain incomplete.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Vault name and metadata
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.CreateVaultRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Vault'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
