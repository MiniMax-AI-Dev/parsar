basePath: /v1
definitions:
  v1.APIError:
    properties:
      code:
        type: string
      message:
        type: string
      param:
        type: string
        x-nullable: true
      type:
        type: string
    required:
    - code
    - message
    - type
    type: object
  v1.Agent:
    properties:
      id:
        type: string
      instructions:
        type: string
        x-nullable: true
      model:
        type: string
      multi_agent:
        $ref: '#/definitions/v1.MultiAgentConfig'
      name:
        type: string
        x-nullable: true
      reasoning:
        $ref: '#/definitions/v1.Reasoning'
      service_tier:
        enum:
        - auto
        type: string
      text:
        $ref: '#/definitions/v1.TextConfig'
      tools:
        items:
          type: object
        type: array
    required:
    - id
    - model
    - multi_agent
    - reasoning
    - service_tier
    - text
    - tools
    type: object
  v1.AgentDeleted:
    properties:
      deleted:
        enum:
        - true
        type: boolean
      id:
        type: string
      object:
        enum:
        - agent.deleted
        type: string
    required:
    - deleted
    - id
    - object
    type: object
  v1.CreateAgentRequest:
    properties:
      instructions:
        type: string
        x-nullable: true
      metadata:
        additionalProperties:
          type: string
        type: object
        x-nullable: true
      model:
        type: string
      multi_agent:
        type: object
        x-nullable: true
      name:
        maxLength: 128
        type: string
        x-nullable: true
      reasoning:
        allOf:
        - $ref: '#/definitions/v1.Reasoning'
        x-nullable: true
      service_tier:
        enum:
        - auto
        - default
        - flex
        - priority
        - fast
        type: string
        x-nullable: true
      text:
        allOf:
        - $ref: '#/definitions/v1.SavedAgentTextInput'
        x-nullable: true
      tools:
        items:
          type: object
        type: array
        x-nullable: true
    required:
    - model
    type: object
  v1.CreateEventsRequest:
    properties:
      events:
        items:
          $ref: '#/definitions/v1.SessionInput'
        type: array
    required:
    - events
    type: object
  v1.CreateSessionRequest:
    properties:
      agent:
        $ref: '#/definitions/v1.InlineAgent'
      agent_id:
        type: string
      environment:
        $ref: '#/definitions/v1.Environment'
      input:
        description: |-
          Input accepts a string or an ordered array of user InputMessage objects.
          Omission and null create an idle Session; non-text content is not supported yet.
        x-nullable: true
      metadata:
        additionalProperties:
          type: string
        type: object
        x-nullable: true
      stream:
        default: false
        type: boolean
      vault_ids:
        items:
          type: string
        type: array
    required:
    - environment
    type: object
  v1.CreateVaultRequest:
    properties:
      metadata:
        additionalProperties:
          type: string
        type: object
        x-nullable: true
      name:
        type: string
    type: object
  v1.Environment:
    properties:
      capability_directories:
        items:
          type: string
        type: array
        x-nullable: true
      type:
        enum:
        - none
        - self_hosted
        type: string
      workspace_directory:
        type: string
    required:
    - type
    type: object
  v1.EnvironmentInfo:
    properties:
      files:
        items:
          type: object
        type: array
      id:
        type: string
      object:
        enum:
        - agent.environment
        type: string
      plugins:
        items:
          type: object
        type: array
      skills:
        items:
          type: object
        type: array
      status:
        enum:
        - pending
        - connected
        - disconnected
        - expired
        - failed
        type: string
      type:
        enum:
        - openai_hosted
        - self_hosted
        type: string
    required:
    - files
    - id
    - object
    - plugins
    - skills
    - status
    - type
    type: object
  v1.ErrorResponse:
    properties:
      error:
