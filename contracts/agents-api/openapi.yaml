    type: object
  v1.InlineAgent:
    properties:
      instructions:
        type: string
        x-nullable: true
      model:
        type: string
      multi_agent:
        type: object
        x-nullable: true
      reasoning:
        allOf:
        - $ref: '#/definitions/v1.Reasoning'
        x-nullable: true
      service_tier:
        enum:
        - auto
        - default
        - flex
        - priority
        - fast
        type: string
        x-nullable: true
      text:
        allOf:
        - $ref: '#/definitions/v1.SavedAgentTextInput'
        x-nullable: true
      tools:
        items:
          type: object
        type: array
        x-nullable: true
    type: object
  v1.InputContent:
    properties:
      text:
        type: string
      type:
        enum:
        - input_text
        type: string
    required:
    - text
    - type
    type: object
  v1.InputMessage:
    properties:
      content:
        items:
          $ref: '#/definitions/v1.InputContent'
