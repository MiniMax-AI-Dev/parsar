    post:
      consumes:
      - application/json
      description: Supports inline configuration or a tenant-owned saved agent_id
        with per-Session field replacements. Execution supports model/instructions,
        text verbosity, non-deferred function tools, disabled multi_agent, implicit
        reasoning, service tier auto and environment type none, subject to the configured
        engine. Codex additionally supports HTTP MCP with explicit service origin,
        native allowed_tools and boolean required defaulting to false. Session vault_ids
        attach only project-owned Vaults; credential_id selects an attached static
        bearer credential for the exact HTTPS URL, while null/omission selects a unique
        match or remains anonymous. Ambiguous selection rejects creation. Frozen private
        selections never populate an omitted public credential_id; missing decryption
        configuration fails dispatch without anonymous fallback. Required initialization
        uses native startup before the first native Turn, including cold resume, and
        requires a separately advertised capability; exact hosted creation timing
        and error parity remain unverified. Other MCP origins and OAuth remain unsupported.
        The self_hosted profile requires Codex, an absolute workspace_directory and
        empty capability_directories, with optional non-deferred function tools and
        HTTP MCP using explicit service origin, optionally authenticated by the attached
        Vault rules. Remote MCP and remote Bearer authentication each require separately
        advertised combination support; old peers cannot receive unsupported work.
        Omitted/null capability_directories use the empty-list default; self_hosted
        requires configured execution plus executor registry. Claude SDK currently
        requires medium verbosity and object-root function schemas. It supports anonymous
        or attached static-bearer service-origin HTTP MCP on none with required=false
        and separately advertised MCP/bearer runtime support. The shared Vault selection
        and immutable binding rules apply; unsupported native labels/tool names reject
        before persistence. An attached Vault with no matching credential may remain
        anonymous; missing keys or failed credential lookup/decryption never fall
        back to anonymous execution. Omitted stream defaults to false; stream and
        agent_id cannot be null. Metadata may be null, but its values must be strings.
        Initial input accepts a string or user-message array containing text. None
        initial input atomically starts a Turn; self_hosted initial input is reserved
        while returning its Environment connection target, with execution deferred
        to native readiness and Session failure on initial timeout. Omitted or null
        input creates an idle Session. With stream=true, returns live Session events
        starting at creation; disconnect does not cancel execution. New Sessions retain
        their authenticated creator; all creation retries require the same typed subject,
        including across key rotation. Saved-Agent retries and inline requests using
        Vault attachments or credential references retain caller intent independently
        of later resource changes; unrelated inline retries preserve resolved/default
        equivalences. Unknown historical creators reject retries; known creators without
        recorded intent retain resolved-snapshot retry rules. These conflict policies
        are local and not verified hosted parity. Creation retries observe future
        events without replay; retry with stream=false to retrieve the Session. Non-text
        initial input remains unsupported.
