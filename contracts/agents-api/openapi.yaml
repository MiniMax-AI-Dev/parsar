  /agents/sessions/{session_id}/events:
    get:
      description: Live-only events, including command output fragments from capable
        Codex peers as agent.output.command_execution_output.delta with stable Item/output
        indexes. Native text conversion and output quotas apply; completion snapshots
        remain authoritative. Reconnect through Session, Turn and Items reads; missed
        events are not replayed. A lagging stream closes with an error when its bounded
        buffer is exceeded. Session activity includes immutable pending-input connection
        actions before Turn creation; self_hosted environments use the same safe output
        as Session retrieval.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
