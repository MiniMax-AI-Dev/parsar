basePath: /v1
definitions:
  v1.APIError:
    properties:
      code:
        type: string
      message:
        type: string
      param:
        type: string
      type:
        type: string
    required:
    - code
    - message
    - type
    type: object
  v1.Agent:
    properties:
      id:
        type: string
      instructions:
        type: string
      model:
        type: string
      multi_agent:
        $ref: '#/definitions/v1.MultiAgentConfig'
      name:
        type: string
      reasoning:
        $ref: '#/definitions/v1.Reasoning'
      service_tier:
        enum:
        - auto
        type: string
      text:
        $ref: '#/definitions/v1.TextConfig'
      tools:
        items:
          type: object
        type: array
    required:
    - id
    - model
    - multi_agent
    - reasoning
    - service_tier
    - text
    - tools
    type: object
  v1.CreateSessionRequest:
    properties:
      agent:
        $ref: '#/definitions/v1.InlineAgent'
      agent_id:
        type: string
      environment:
        $ref: '#/definitions/v1.Environment'
      input:
        type: object
      metadata:
        additionalProperties:
          type: string
        type: object
      stream:
        type: boolean
      vault_ids:
        items:
          type: string
        type: array
    required:
    - agent
    - environment
    type: object
  v1.Environment:
    properties:
      type:
        enum:
        - none
        type: string
    required:
    - type
    type: object
  v1.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/v1.APIError'
    required:
    - error
    type: object
  v1.InlineAgent:
    properties:
      instructions:
        type: string
      model:
        type: string
    required:
    - model
    type: object
  v1.MultiAgentConfig:
    properties:
      enabled:
        type: boolean
      max_concurrent_subagents:
        type: integer
    required:
    - enabled
    type: object
  v1.Reasoning:
    properties:
      effort:
        type: string
      summary:
        type: string
    type: object
  v1.Session:
    properties:
      agent:
        $ref: '#/definitions/v1.Agent'
      created_at:
        type: integer
      environment:
        $ref: '#/definitions/v1.Environment'
      error:
        type: string
      id:
        type: string
      last_active_at:
        type: integer
      metadata:
        additionalProperties:
          type: string
        type: object
      object:
        enum:
        - agent.session
        type: string
      required_actions:
        items:
          type: object
        type: array
      status:
        enum:
        - idle
        type: string
      usage:
        type: object
      vault_ids:
        items:
          type: string
        type: array
    required:
    - agent
    - created_at
    - environment
    - id
    - last_active_at
    - metadata
    - object
    - required_actions
    - status
    - vault_ids
    type: object
  v1.SessionList:
    properties:
      data:
        items:
          $ref: '#/definitions/v1.Session'
        type: array
      has_more:
        type: boolean
    required:
    - data
    - has_more
    type: object
  v1.TextConfig:
    properties:
      format:
        $ref: '#/definitions/v1.TextFormat'
      verbosity:
        enum:
        - medium
        type: string
    required:
    - format
    - verbosity
    type: object
  v1.TextFormat:
    properties:
      type:
        enum:
        - text
        type: string
    required:
    - type
    type: object
info:
  contact: {}
  description: Supported single-Agent execution resources from the pinned openai-python
    beta/agents contract.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Agents API
  version: "1"
paths:
  /agents/sessions:
    get:
      description: Cursor and results are scoped to the authenticated execution tenant.
        Saved agent filtering is not supported yet.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Last Session ID from the previous page
        in: query
        name: after
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: desc
        description: Creation order
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.SessionList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List execution Sessions
      tags:
      - Sessions
    post:
      consumes:
      - application/json
      description: Supports inline model/instructions and environment type none. Execution
        input and other options are explicitly unsupported in this slice.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Creation retry key, up to 128 bytes
        in: header
        name: Idempotency-Key
        type: string
      - description: Session configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.CreateSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Session'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an execution Session
      tags:
      - Sessions
  /agents/sessions/{session_id}:
    get:
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Session'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Retrieve an execution Session
      tags:
      - Sessions
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
