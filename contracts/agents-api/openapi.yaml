    type: object
info:
  contact: {}
  description: Supported single-Agent execution resources from the pinned openai-python
    beta/agents contract. Bearer keys bind an execution principal to one project;
    optional OpenAI-Organization and OpenAI-Project headers must match that binding.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Agents API
  version: "1"
paths:
  /agents:
    get:
      description: Lists only the authenticated tenant's saved Agents, independently
        of Sessions. Positive int64 limits are accepted; each page returns at most
        100 resources with continuation. The local default is 20; exact upstream default/cap,
        empty cursor fields and error conformance remain unverified.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Last Agent ID from the previous page
        in: query
        name: after
        type: string
      - description: Maximum requested resources; pages contain at most 100
        in: query
        minimum: 1
        name: limit
        type: integer
      - default: desc
        description: Creation order
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.SavedAgentList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List reusable Agents
      tags:
      - Agents
    post:
      consumes:
      - application/json
      description: Persists configuration independently of execution. Supports model/name/instructions/metadata,
        explicit reasoning and service tiers, multi_agent, text/json_schema, function/tool_search/programmatic_tool_calling
        and credential-free HTTP MCP with explicit service origin and required omitted/false.
        MCP allowed_tools preserves null versus empty; saved HTTP transport includes
        empty headers. Model-derived reasoning defaults, other MCP variants, web_search
        and public retry conformance remain incomplete. Session execution admits only
        its supported configuration subset.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Reusable Agent configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.CreateAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.SavedAgent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a reusable Agent
      tags:
      - Agents
  /agents/{agent_id}:
    delete:
      description: Deletes only the authenticated tenant's saved configuration. Existing
        Session snapshots, history and recorded creation retry identities remain independent.
        Missing and repeated deletion locally return404; exact hosted error and in-flight
        creation/deletion semantics remain unverified.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.AgentDeleted'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a reusable Agent
      tags:
      - Agents
    get:
      description: Reads the saved resource owned by the authenticated tenant, independently
        of execution Sessions.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.SavedAgent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Retrieve a reusable Agent
      tags:
      - Agents
    post:
      consumes:
      - application/json
      description: Preserves omitted fields and replaces supplied fields using shared
        saved-configuration validation. Null name/instructions clear; null or empty
        metadata clears all pairs. Existing Session snapshots are unchanged. Nested
        replacement/null defaults, model-derived reasoning and exact hosted error/no-op
        timestamp behavior remain incompletely verified.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      - description: Supplied reusable Agent fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.SavedAgent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a reusable Agent
      tags:
      - Agents
  /agents/environments/{environment_id}:
    get:
      description: Returns durable connection status and safe installed metadata for
        the supported self_hosted profile. Empty files/plugins/skills describe the
        absence of API-managed installations, not the contents or discovered capabilities
        of the caller's machine. Unsupported installation configurations remain implementation
        gaps. This read does not prepare execution, start compute or require an enabled
        execution worker. Session deletion removes the associated Environment from
        public reads; project-shared read authorization is unchanged. Connection status
        does not prove native readiness or process quiescence.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Environment ID
        in: path
        name: environment_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.EnvironmentInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Retrieve an execution Environment
      tags:
      - Environments
  /agents/sessions:
    get:
      description: Cursor and results are scoped to the authenticated execution tenant.
        Optional agent_id matches the immutable root Agent ID, including inline Agents
        and historical Sessions whose saved source was updated or deleted. Omission
        lists all Agents. Returns the same Environment and pending-input activity
        projection as Session retrieval, including self_hosted Sessions.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Root Agent ID whose Sessions to return
        in: query
        name: agent_id
        type: string
      - description: Last Session ID from the previous page
        in: query
        name: after
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: desc
        description: Creation order
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.SessionList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List execution Sessions
      tags:
      - Sessions
    post:
      consumes:
      - application/json
      description: Supports inline configuration or a tenant-owned saved agent_id
        with per-Session field replacements. Execution supports model/instructions,
        text verbosity, non-deferred function tools, disabled multi_agent, implicit
        reasoning, service tier auto and environment type none, subject to the configured
        engine. Codex none additionally supports credential-free HTTP MCP with explicit
        service origin, native allowed_tools and required omitted/false; other MCP
        origins, credentials and readiness remain unsupported. The initial self_hosted
        profile requires Codex, an absolute workspace_directory, empty capability_directories
        and optional non-deferred function tools. Omitted/null capability_directories
        use the empty-list default; self_hosted requires configured execution plus
        executor registry. Claude SDK currently requires medium verbosity and object-root
        function schemas. Omitted stream defaults to false; stream and agent_id cannot
        be null. Metadata may be null, but its values must be strings. Initial input
        accepts a string or user-message array containing text. None initial input
        atomically starts a Turn; self_hosted initial input is reserved while returning
        its Environment connection target, with execution deferred to native readiness
        and Session failure on initial timeout. Omitted or null input creates an idle
        Session. With stream=true, returns live Session events starting at creation;
        disconnect does not cancel execution. New Sessions retain their authenticated
        creator; all creation retries require the same typed subject, including across
        key rotation. Saved-Agent retries retain request intent independently of later
        Agent changes. Unknown historical creators reject retries; known creators
        without recorded intent retain resolved-snapshot retry rules. These conflict
        policies are local and not verified hosted parity. Creation retries observe
        future events without replay; retry with stream=false to retrieve the Session.
        Non-text initial input remains unsupported.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Creation retry key, up to 128 bytes
        in: header
        name: Idempotency-Key
        type: string
      - description: Session configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.CreateSessionRequest'
      produces:
      - application/json
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Session'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an execution Session
      tags:
      - Sessions
  /agents/sessions/{session_id}:
    delete:
      description: Removes the Session and its history from the public API. Active
        work receives a cancellation request; confirmation does not guarantee native
        execution has stopped. Internal records and native history are retained pending
        separate physical cleanup. Missing/repeated deletion locally returns 404;
        exact hosted errors and overlapping stream timing remain unverified.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.SessionDeleted'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an execution Session
      tags:
      - Sessions
    get:
      description: Returns supported none and self_hosted Session environments. Pending
        input can require an Environment connection before a Turn exists; connection
        observations are not native execution readiness.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Session'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Retrieve an execution Session
      tags:
      - Sessions
    post:
      consumes:
      - application/json
      description: Omit metadata to leave it unchanged, send null or {} to clear it,
        or supply an object to replace all pairs. Up to 16 string pairs, with keys
        at most 64 characters and values at most 512 characters. Execution configuration
        and activity are unchanged. Returns the same safe Environment and pending-input
        activity projection as Session retrieval.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      - description: Session metadata
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Session'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update execution Session metadata
      tags:
      - Sessions
  /agents/sessions/{session_id}/events:
    get:
      description: Live-only events. Reconnect through Session, Turn and Items reads;
        missed events are not replayed. A lagging stream closes with an error when
        its bounded buffer is exceeded. Session activity includes immutable pending-input
        connection actions before Turn creation; self_hosted environments use the
        same safe output as Session retrieval.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.SessionEvent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Stream live Session events
      tags:
      - Events
    post:
      consumes:
      - application/json
      description: For environment none, atomically accepts text messages, cancellation
        and function results. Messages steer active work or start a queued Turn. The
        self_hosted profile accepts text-only batches. Under the Session lock, matching
        retries retain their original target; new active messages append to the current
        Turn, while idle messages reserve work and wait up to the original five-minute
        connection/admission deadline. Return 204 only after durable admission, without
        claiming native application; active messages create no Turn or reservation.
        Cancellation-only self_hosted batches use existing durable cancellation admission
        and return 204 without waiting for native exit; a new cancellation conflicts
        while a pre-Turn reservation is pending. Homogeneous tool_result-only self_hosted
        batches reuse existing scoped result admission and application receipts without
        creating a Turn or bypassing a pending reservation. Mixed self_hosted batches
        remain unsupported. HTTP expiry/cancellation use local 409 environment_input_expired/environment_input_cancelled
        errors; exact hosted failure mapping is unverified. Losing execution ownership
        returns 503. Disconnecting the waiting HTTP request does not cancel retained
        work or restart its deadline. Retry keys identify the whole ordered batch.
        Function output accepts text or ordered text/image parts subject to engine
        support; Claude SDK currently accepts text results only. Message images are
        not supported yet.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Retry key, up to 128 bytes
        in: header
        name: Idempotency-Key
        type: string
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      - description: Ordered input events
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.CreateEventsRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Submit Session input events
      tags:
      - Sessions
  /agents/sessions/{session_id}/items:
    get:
      description: Returns supported message and tool Items in first-observation order.
        Native engine fields are projected explicitly; unfinished Items on terminal
        Turns are incomplete. Cursors belong to the same tenant and Session.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      - description: Last Item ID from the previous page
        in: query
        name: after
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: desc
        description: Creation order
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.ItemList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List persisted execution Items
      tags:
      - Items
  /agents/sessions/{session_id}/turns:
    get:
      description: Returns persisted state in creation order. The cursor belongs to
        the same Session and tenant. Usage contains the latest recorded complete token
        breakdown; missing measurements remain null.
      parameters:
