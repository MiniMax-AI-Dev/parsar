basePath: /v1
definitions:
  v1.APIError:
    properties:
      code:
        type: string
      message:
        type: string
      param:
        type: string
        x-nullable: true
      type:
        type: string
    required:
    - code
    - message
    - type
    type: object
  v1.Agent:
    properties:
      id:
        type: string
      instructions:
        type: string
        x-nullable: true
      model:
        type: string
      multi_agent:
        $ref: '#/definitions/v1.MultiAgentConfig'
      name:
        type: string
        x-nullable: true
      reasoning:
        $ref: '#/definitions/v1.Reasoning'
      service_tier:
        enum:
        - auto
        type: string
      text:
        $ref: '#/definitions/v1.TextConfig'
      tools:
        items:
          type: object
        type: array
    required:
    - id
    - model
    - multi_agent
    - reasoning
    - service_tier
    - text
    - tools
    type: object
  v1.CreateEventsRequest:
    properties:
      events:
        items:
          $ref: '#/definitions/v1.SessionInput'
        type: array
    required:
    - events
    type: object
  v1.CreateSessionRequest:
    properties:
      agent:
        $ref: '#/definitions/v1.InlineAgent'
      agent_id:
        type: string
      environment:
        $ref: '#/definitions/v1.Environment'
      input:
        type: object
        x-nullable: true
      metadata:
        additionalProperties:
          type: string
        type: object
        x-nullable: true
      stream:
        default: false
        type: boolean
      vault_ids:
        items:
          type: string
        type: array
    required:
    - agent
    - environment
    type: object
  v1.Environment:
    properties:
      type:
        enum:
        - none
        type: string
    required:
    - type
    type: object
  v1.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/v1.APIError'
    required:
    - error
    type: object
  v1.FunctionCallAction:
    properties:
      arguments: {}
      call_id:
        type: string
      name:
        type: string
      turn_id:
        type: string
      type:
        enum:
        - function_call
        type: string
    required:
    - arguments
    - call_id
    - name
    - turn_id
    - type
    type: object
  v1.FunctionToolInput:
    properties:
      defer_loading:
        type: boolean
      description:
        type: string
      name:
        type: string
      parameters:
        type: object
      type:
        enum:
        - function
        type: string
    required:
    - description
    - name
    - parameters
    - type
    type: object
  v1.InlineAgent:
    properties:
      instructions:
        type: string
        x-nullable: true
      model:
        type: string
      text:
        allOf:
        - $ref: '#/definitions/v1.TextConfigInput'
        x-nullable: true
      tools:
        items:
          $ref: '#/definitions/v1.FunctionToolInput'
        type: array
        x-nullable: true
    required:
    - model
    type: object
  v1.InputContent:
    properties:
      text:
        type: string
      type:
        enum:
        - input_text
        type: string
    required:
    - text
    - type
    type: object
  v1.InputMessage:
    properties:
      content:
        items:
          $ref: '#/definitions/v1.InputContent'
        type: array
      role:
        enum:
        - user
        type: string
      type:
        enum:
        - message
        type: string
    required:
    - content
    - role
    type: object
  v1.InputTokenDetails:
    properties:
      cached_tokens:
        type: integer
    required:
    - cached_tokens
    type: object
  v1.Item:
    properties:
      action:
        $ref: '#/definitions/v1.WebSearchAction'
      arguments: {}
      call_id:
        type: string
      command:
        type: string
      content:
        items:
          $ref: '#/definitions/v1.ItemContent'
        type: array
      cwd:
        type: string
      duration_ms:
        type: integer
      error: {}
      exit_code:
        type: integer
      id:
        type: string
      name:
        type: string
      output: {}
      phase:
        enum:
        - commentary
        - final_answer
        type: string
      role:
        enum:
        - user
        - assistant
        type: string
      server_label:
        type: string
      status:
        enum:
        - in_progress
        - completed
        - failed
        - incomplete
        type: string
      turn_id:
        type: string
      type:
        enum:
        - message
        - command_execution
        - mcp_call
        - function_call
        - function_call_output
        - web_search_call
        type: string
    required:
    - id
    - status
    - turn_id
    - type
    type: object
  v1.ItemContent:
    properties:
      image_url:
        type: string
      text:
        type: string
      type:
        enum:
        - input_text
        - output_text
        - input_image
        type: string
    required:
    - type
    type: object
  v1.ItemList:
    properties:
      data:
        items:
          $ref: '#/definitions/v1.Item'
        type: array
      has_more:
        type: boolean
    required:
    - data
    - has_more
    type: object
  v1.MultiAgentConfig:
    properties:
      enabled:
        type: boolean
      max_concurrent_subagents:
        type: integer
        x-nullable: true
    required:
    - enabled
    type: object
  v1.OutputTokenDetails:
    properties:
      reasoning_tokens:
        type: integer
    required:
    - reasoning_tokens
    type: object
  v1.Reasoning:
    properties:
      effort:
        type: string
        x-nullable: true
      summary:
        type: string
        x-nullable: true
    type: object
  v1.Session:
    properties:
      agent:
        $ref: '#/definitions/v1.Agent'
      created_at:
        type: integer
      environment:
        $ref: '#/definitions/v1.Environment'
      error:
        type: string
        x-nullable: true
      id:
        type: string
      last_active_at:
        type: integer
      metadata:
        additionalProperties:
          type: string
        type: object
      object:
        enum:
        - agent.session
        type: string
      required_actions:
        items:
          $ref: '#/definitions/v1.FunctionCallAction'
        type: array
      status:
        enum:
        - idle
        - in_progress
        - requires_action
        - failed
        type: string
      usage:
        allOf:
        - $ref: '#/definitions/v1.TokenUsage'
        x-nullable: true
      vault_ids:
        items:
          type: string
        type: array
    required:
    - agent
    - created_at
    - environment
    - id
    - last_active_at
    - metadata
    - object
    - required_actions
    - status
    - vault_ids
    type: object
  v1.SessionEvent:
    properties:
      content_index:
        type: integer
      delta:
        type: string
      error:
        $ref: '#/definitions/v1.StreamError'
      event_id:
        type: string
      item:
        $ref: '#/definitions/v1.Item'
      item_id:
        type: string
      output_index:
        type: integer
      part:
        $ref: '#/definitions/v1.ItemContent'
      session:
        $ref: '#/definitions/v1.Session'
      session_id:
        type: string
      text:
        type: string
      turn:
        $ref: '#/definitions/v1.Turn'
      turn_id:
        type: string
      type:
        type: string
    required:
    - event_id
    - type
    type: object
  v1.SessionInput:
    properties:
      call_id:
        type: string
      error:
        type: string
        x-nullable: true
      input:
        items:
          $ref: '#/definitions/v1.InputMessage'
        type: array
      output:
        x-nullable: true
      success:
        type: boolean
      turn_id:
        type: string
      type:
        enum:
        - agent.session.input.message
        - agent.session.input.cancel
        - agent.session.input.tool_result
        type: string
    required:
    - type
    type: object
  v1.SessionList:
    properties:
      data:
        items:
          $ref: '#/definitions/v1.Session'
        type: array
      has_more:
        type: boolean
    required:
    - data
    - has_more
    type: object
  v1.StreamError:
    properties:
      code:
        type: string
      message:
        type: string
      type:
        type: string
    type: object
  v1.TextConfig:
    properties:
      format:
        $ref: '#/definitions/v1.TextFormat'
      verbosity:
        enum:
        - low
        - medium
        - high
        type: string
    required:
    - format
    - verbosity
    type: object
  v1.TextConfigInput:
    properties:
      format:
        allOf:
        - $ref: '#/definitions/v1.TextFormat'
        x-nullable: true
      verbosity:
        enum:
        - low
        - medium
        - high
        type: string
        x-nullable: true
    type: object
  v1.TextFormat:
    properties:
      type:
        enum:
        - text
        type: string
    required:
    - type
    type: object
  v1.TokenUsage:
    properties:
      input_tokens:
        type: integer
      input_tokens_details:
        $ref: '#/definitions/v1.InputTokenDetails'
      output_tokens:
        type: integer
      output_tokens_details:
        $ref: '#/definitions/v1.OutputTokenDetails'
      total_tokens:
        type: integer
    required:
    - input_tokens
    - input_tokens_details
    - output_tokens
    - output_tokens_details
    - total_tokens
    type: object
  v1.Turn:
    properties:
      agent_id:
        type: string
      completed_at:
        type: integer
        x-nullable: true
      created_at:
        type: integer
      error:
        allOf:
        - $ref: '#/definitions/v1.TurnError'
        x-nullable: true
      id:
        type: string
      object:
        enum:
        - agent.session.turn
        type: string
      session_id:
        type: string
      started_at:
        type: integer
        x-nullable: true
      status:
        enum:
        - queued
        - in_progress
        - waiting
        - completed
        - failed
        - cancelled
        type: string
      usage:
        allOf:
        - $ref: '#/definitions/v1.TokenUsage'
        x-nullable: true
    required:
    - agent_id
    - created_at
    - id
    - object
    - session_id
    - status
    type: object
  v1.TurnError:
    properties:
      code:
        enum:
        - internal_error
        type: string
      message:
        type: string
    required:
    - code
    - message
    type: object
  v1.TurnList:
    properties:
      data:
        items:
          $ref: '#/definitions/v1.Turn'
        type: array
      has_more:
        type: boolean
    required:
    - data
    - has_more
    type: object
  v1.WebSearchAction:
    properties:
      pattern:
        type: string
      queries:
        items:
          type: string
        type: array
      query:
        type: string
      type:
        enum:
        - search
        - open_page
        - find_in_page
        - other
        type: string
      url:
        type: string
    required:
    - type
    type: object
info:
  contact: {}
  description: Supported single-Agent execution resources from the pinned openai-python
    beta/agents contract.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Agents API
  version: "1"
paths:
  /agents/sessions:
    get:
      description: Cursor and results are scoped to the authenticated execution tenant.
        Saved agent filtering is not supported yet.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Last Session ID from the previous page
        in: query
        name: after
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: desc
        description: Creation order
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.SessionList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List execution Sessions
      tags:
      - Sessions
    post:
      consumes:
      - application/json
      description: Supports inline model/instructions, text verbosity, non-deferred
        function tools and environment type none. Omitted stream defaults to false;
        stream and agent_id cannot be null. Metadata may be null, but its values must
        be strings. Execution input and other options are explicitly unsupported in
        this slice.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Creation retry key, up to 128 bytes
        in: header
        name: Idempotency-Key
        type: string
      - description: Session configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.CreateSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Session'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an execution Session
      tags:
      - Sessions
  /agents/sessions/{session_id}:
    get:
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Session'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Retrieve an execution Session
      tags:
      - Sessions
  /agents/sessions/{session_id}/events:
    get:
      description: Live-only events. Reconnect through Session, Turn and Items reads;
        missed events are not replayed. A lagging stream closes with an error when
        its bounded buffer is exceeded.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.SessionEvent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Stream live Session events
      tags:
      - Events
    post:
      consumes:
      - application/json
      description: Atomically accepts text messages, cancellation and function results.
        Messages steer active work or start a queued Turn. Retry keys identify the
        whole ordered batch. Function output accepts text or ordered text/image parts;
        message images are not supported yet.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Retry key, up to 128 bytes
        in: header
        name: Idempotency-Key
        type: string
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      - description: Ordered input events
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.CreateEventsRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Submit Session input events
      tags:
      - Sessions
  /agents/sessions/{session_id}/items:
    get:
      description: Returns supported message and tool Items in first-observation order.
        Native engine fields are projected explicitly; unfinished Items on terminal
        Turns are incomplete. Cursors belong to the same tenant and Session.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      - description: Last Item ID from the previous page
        in: query
        name: after
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: desc
        description: Creation order
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.ItemList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List persisted execution Items
      tags:
      - Items
  /agents/sessions/{session_id}/turns:
    get:
      description: Returns persisted state in creation order. The cursor belongs to
        the same Session and tenant. Usage contains the latest recorded complete token
        breakdown; missing measurements remain null.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      - description: Last Turn ID from the previous page
        in: query
        name: after
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: desc
        description: Creation order
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.TurnList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List execution Turns
      tags:
      - Turns
  /agents/sessions/{session_id}/turns/{turn_id}:
    get:
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      - description: Turn ID
        in: path
        name: turn_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Turn'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Retrieve an execution Turn
      tags:
      - Turns
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
